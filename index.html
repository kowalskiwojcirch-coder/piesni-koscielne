<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Wirtualny sterownik pieśni</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
body {
  margin: 0;
  background: #222;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* OBUDOWA PANELU */
#controller {
  display: flex;
  background: #333;
  border: 6px solid #000;
  border-radius: 16px;
  box-shadow: 0 0 20px #000;
}

/* EKRAN LCD */
#lcd {
  width: 500px;
  height: 250px;
  background: #0f0;
  color: #030;
  font-family: 'Press Start 2P', cursive;
  font-size: 18px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  text-align: center;
  padding: 20px;
  box-shadow: inset 0 0 10px #030;
  line-height: 1.5;
  letter-spacing: 1px;
}

/* PANEL PRZYCISKÓW */
#keys {
  display: grid;
  grid-template-columns: repeat(3, 60px);
  grid-gap: 10px;
  padding: 20px;
  background: #111;
  border-left: 4px solid #000;
  border-radius: 0 12px 12px 0;
}

.key {
  width: 60px;
  height: 60px;
  background: #222;
  color: #0f0;
  font-family: 'Press Start 2P', cursive;
  font-size: 18px;
  border: 2px solid #000;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  justify-content: center;
  align-items: center;
  user-select: none;
  transition: all 0.1s;
}

.key:active {
  background: #0f0;
  color: #030;
  transform: translateY(2px);
}
</style>
</head>
<body>

<div id="controller">
  <div id="lcd">
    <div id="songTitle">Wybierz pieśń</div>
    <div id="songVerse">Zwrotka pojawi się tutaj</div>
  </div>

  <div id="keys">
    <div class="key" onclick="prevVerse()">↑</div>
    <div class="key" onclick="nextVerse()">↓</div>
    <div class="key" onclick="restartSong()">R</div>
    <div class="key" onclick="loadSong(0)">1</div>
    <div class="key" onclick="loadSong(1)">2</div>
    <div class="key" onclick="loadSong(2)">3</div>
    <div class="key" onclick="loadSong(3)">4</div>
    <div class="key" onclick="loadSong(4)">5</div>
    <div class="key" onclick="loadSong(5)">6</div>
  </div>
</div>

<script>
// Przykładowe pieśni
const songs = [
  {title:"Barka", verses:[
    "Pan kiedyś stanął nad brzegiem\nSzukał ludzi gotowych pójść za Nim",
    "By łowić serca\nSłów Bożych prawdą",
    "Z Nim płynęli przez życie\nNie lękając się niczego"
  ]},
  {title:"Czarna Madonna", verses:[
    "Jest zakątek na tej ziemi\nGdzie powracać każdy chce",
    "Gdzie króluje Jej Oblicze\nNa Jasnej Górze",
    "Tam modlitwa płynie z serc\nNiech Maryja czuwa"
  ]},
  {title:"Abba Ojcze", verses:[
    "Ty wyzwoliłeś nas Panie\nZ kajdan i samych siebie",
    "A Chrystus stał się Barankiem\nOfiarą miłości",
    "Jego miłość nas prowadzi\nPrzez dni i noce"
  ]},
  {title:"Kiedy ranne wstają zorze", verses:[
    "Kiedy ranne wstają zorze\nTobie ziemia, Tobie morze",
    "Tobie śpiewa żywioł wszelki\nChwałę Tobie"
  ]},
  {title:"Z dawna Polski Tyś Królową", verses:[
    "Z dawna Polski Tyś Królową, Maryjo",
    "Ty za nami przemów słowo, Maryjo"
  ]}
];

let currentSong = null;
let currentVerse = 0;

function loadSong(index){
  currentSong = index;
  currentVerse = 0;
  updateLCD();
}

function nextVerse(){
  if(currentSong===null) return;
  if(currentVerse < songs[currentSong].verses.length-1){
    currentVerse++;
    updateLCD();
  }
}

function prevVerse(){
  if(currentSong===null) return;
  if(currentVerse > 0){
    currentVerse--;
    updateLCD();
  }
}

function restartSong(){
  if(currentSong!==null){
    currentVerse = 0;
    updateLCD();
  }
}

function updateLCD(){
  document.getElementById("songTitle").textContent = songs[currentSong].title;
  document.getElementById("songVerse").textContent = songs[currentSong].verses[currentVerse];
}

// Sterowanie strzałkami klawiatury
document.addEventListener('keydown', function(e){
  if(e.key === "ArrowUp") prevVerse();
  if(e.key === "ArrowDown") nextVerse();
  if(e.key === "r" || e.key === "R") restartSong();
});
</script>

</body>
</html>
