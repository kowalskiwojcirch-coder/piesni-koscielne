<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Tugal – projekcja kościelna</title>

<link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  background:#111;
  height:100vh;
  display:flex;
}

/* ===== TV ===== */
#tv{
  flex:1;
  margin:30px;
  background:#000;
  border:18px solid #222;
  box-shadow:0 0 60px #000;
  padding:50px;
  box-sizing:border-box;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'VT323', monospace;
}

#tvText{
  color:#ff9900;
  font-size:48px;
  line-height:1.8;
  text-align:center;
  white-space:pre-line;
  width:100%;
}

/* gwiazdki */
.star{
  position:absolute;
  color:#ff9900;
  font-size:28px;
}
.tl{top:10px;left:10px}
.tr{top:10px;right:10px}
.bl{bottom:10px;left:10}
.br{bottom:10px;right:10px}

/* ===== PANEL BOCZNY ===== */
#side{
  width:420px;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:15px;
}

/* EDYTOR */
textarea{
  flex:1;
  resize:none;
  font-size:18px;
  padding:15px;
}

/* PRZYCISKI */
button{
  padding:10px;
  font-size:16px;
  cursor:pointer;
}

/* ===== TUGAL ===== */
#tugal{
  background:#2b2b2b;
  padding:15px;
  border:2px solid #111;
  font-family:'Press Start 2P', monospace;
}

#lcd{
  background:#0f0;
  color:#030;
  height:70px;
  padding:8px;
  font-size:10px;
  margin-bottom:10px;
  white-space:pre-line;
}

#keys{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.key{
  background:#333;
  color:#0f0;
  border:none;
  padding:10px 0;
}
</style>
</head>

<body>

<!-- TV -->
<div id="tv">
  <div class="star tl">*</div>
  <div class="star tr">*</div>
  <div class="star bl">*</div>
  <div class="star br">*</div>

  <div id="tvText">*</div>
</div>

<!-- BOK -->
<div id="side">

  <textarea id="input" placeholder="Wpisz lub wklej tekst pieśni..."></textarea>

  <button onclick="sendText()">WYŚWIETL</button>
  <button onclick="clearText()">WYCZYŚĆ</button>

  <!-- TUGAL -->
  <div id="tugal">
    <div id="lcd">SYSTEM OK</div>

    <div id="keys">
      <button class="key" onclick="scrollUp()">▲</button>
      <button class="key" onclick="scrollDown()">▼</button>
      <button class="key" onclick="clearText()">CLR</button>
    </div>
  </div>

</div>

<script>
const tvText = document.getElementById("tvText");
const input = document.getElementById("input");
const lcd = document.getElementById("lcd");

let lines = [];
let offset = 0;

function sendText(){
  lines = input.value.split("\n");
  offset = 0;
  updateScreen();
  lcd.textContent = "WYSWIETLANIE\nLINIA 1";
}

function updateScreen(){
  let view = lines.slice(offset, offset + 6).join("\n");
  tvText.textContent = "*\n\n" + view + "\n\n*";
}

function scrollDown(){
  if(offset < lines.length - 1){
    offset++;
    updateScreen();
    lcd.textContent = "LINIA " + (offset + 1);
  }
}

function scrollUp(){
  if(offset > 0){
    offset--;
    updateScreen();
    lcd.textContent = "LINIA " + (offset + 1);
  }
}

function clearText(){
  tvText.textContent = "*";
  lcd.textContent = "PUSTE";
}
</script>

</body>
</html>
