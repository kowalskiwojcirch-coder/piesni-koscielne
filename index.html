<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Pieśni kościelne</title>

<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background: #000;
  color: #f5f5f5;
  font-family: 'EB Garamond', serif;
  overflow: hidden;
}

/* MENU */
#menu {
  position: fixed;
  left: 0;
  top: 0;
  width: 320px;
  height: 100%;
  background: rgba(10,10,10,0.95);
  padding: 20px;
  overflow-y: auto;
  box-shadow: 4px 0 20px rgba(0,0,0,0.6);
}

#menu h2 {
  text-align: center;
  margin-bottom: 15px;
}

#search {
  width: 100%;
  padding: 8px;
  margin-bottom: 10px;
  font-size: 16px;
}

.song {
  width: 100%;
  margin: 4px 0;
  padding: 8px;
  font-size: 16px;
  background: #111;
  border: none;
  color: #ddd;
  cursor: pointer;
}
.song:hover {
  background: #222;
}

/* EKRAN */
#screen {
  margin-left: 340px;
  padding: 60px;
  height: 100vh;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  text-shadow: 1px 1px 4px #000;
}

#title {
  font-size: 56px;
  text-align: center;
  margin-bottom: 20px;
}

#verse {
  font-size: 42px;
  line-height: 1.4;
  text-align: center;
  white-space: pre-line;
  flex-grow: 1;
}

/* KONTROLA */
#controls {
  text-align: center;
  margin-top: 20px;
}

.ctrl {
  font-size: 18px;
  padding: 10px 20px;
  margin: 0 10px;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="menu">
  <h2>Pieśni kościelne</h2>
  <input type="text" id="search" placeholder="Szukaj pieśni..." onkeyup="searchSongs()">

  <div id="songList">
    <!-- Pieśni będą wygenerowane dynamicznie -->
  </div>
</div>

<div id="screen">
  <div id="title">Wybierz pieśń</div>
  <div id="verse">Zwrotka pojawi się tutaj</div>

  <div id="controls">
    <button class="ctrl" onclick="prevVerse()">⬅ Poprzednia</button>
    <button class="ctrl" onclick="nextVerse()">Następna ➡</button>
  </div>
</div>

<script>
// Przykladowe pieśni – można łatwo dodać 50+ i zwrotki
const songs = [
  {title:"Barka", verses:[
    `Pan kiedyś stanął nad brzegiem\nSzukał ludzi gotowych pójść za Nim`,
    `By łowić serca\nSłów Bożych prawdą`,
    `Z Nim płynęli przez życie\nNie lękając się niczego`
  ]},
  {title:"Czarna Madonna", verses:[
    `Jest zakątek na tej ziemi\nGdzie powracać każdy chce`,
    `Gdzie króluje Jej Oblicze\nNa Jasnej Górze`,
    `Tam modlitwa płynie z serc\nNiech Maryja czuwa`
  ]},
  {title:"Abba Ojcze", verses:[
    `Ty wyzwoliłeś nas Panie\nZ kajdan i samych siebie`,
    `A Chrystus stał się Barankiem\nOfiarą miłości`,
    `Jego miłość nas prowadzi\nPrzez dni i noce`
  ]},
  {title:"Kiedy ranne wstają zorze", verses:[
    `Kiedy ranne wstają zorze\nTobie ziemia, Tobie morze`,
    `Tobie śpiewa żywioł wszelki\nChwałę Tobie`
  ]},
  {title:"Z dawna Polski Tyś Królową", verses:[
    `Z dawna Polski Tyś Królową, Maryjo`,
    `Ty za nami przemów słowo, Maryjo`
  ]},
  {title:"Wesoły nam dzień nastał", verses:[
    `Wesoły nam dzień nastał\nRadujmy się w Panu`,
    `Chwała Bogu na wysokości\nPokój ludziom dobrej woli`
  ]},
  {title:"O Stworzycielu Duchu", verses:[
    `O Stworzycielu Duchu przyjdź\nI napełnij serca wiernych`,
    `Ty, który jesteś miłością\nNapełnij nas swoim światłem`
  ]},
  {title:"Chwalcie łąki umajone", verses:[
    `Chwalcie łąki umajone\nChwalcie łąki umajone`,
    `Chwalcie lasy, góry i doliny\nChwalcie wszystko wokoło`
  ]},
  {title:"Ciebie Boże chwalimy", verses:[
    `Ciebie Boże chwalimy\nCiebie Panie wysławiamy`,
    `Dziękujemy Ci za wszystko\nI prosimy o łaski`
  ]},
  {title:"Ojcze nasz", verses:[
    `Ojcze nasz, któryś jest w niebie\nŚwięć się imię Twoje`,
    `Przyjdź królestwo Twoje\nBądź wola Twoja`
  ]}
  // Dodawaj kolejne do 50+
];

let currentSong = null;
let currentVerse = 0;

// GENEROWANIE LISTY PIEŚNI
function generateSongList(){
  const list = document.getElementById("songList");
  list.innerHTML="";
  songs.forEach((song,i)=>{
    const btn = document.createElement("button");
    btn.className="song";
    btn.textContent=song.title;
    btn.onclick = ()=>loadSong(i);
    list.appendChild(btn);
  });
}

generateSongList();

// WYSZUKIWARKA
function searchSongs(){
  const term = document.getElementById("search").value.toLowerCase();
  const list = document.getElementById("songList");
  list.innerHTML="";
  songs.forEach((song,i)=>{
    if(song.title.toLowerCase().includes(term)){
      const btn = document.createElement("button");
      btn.className="song";
      btn.textContent=song.title;
      btn.onclick = ()=>loadSong(i);
      list.appendChild(btn);
    }
  });
}

// ŁADOWANIE PIEŚNI
function loadSong(index){
  currentSong = index;
  currentVerse = 0;
  document.getElementById("title").textContent = songs[index].title;
  document.getElementById("verse").textContent = songs[index].verses[0];
}

// PRZEWIJANIE ZWROTEK
function nextVerse(){
  if(currentSong===null) return;
  if(currentVerse<songs[currentSong].verses.length-1){
    currentVerse++;
    document.getElementById("verse").textContent = songs[currentSong].verses[currentVerse];
  }
}

function prevVerse(){
  if(currentSong===null) return;
  if(currentVerse>0){
    currentVerse--;
    document.getElementById("verse").textContent = songs[currentSong].verses[currentVerse];
  }
}

// STEROWANIE STRZAŁKAMI
document.addEventListener('keydown',function(e){
  if(e.key==="ArrowRight") nextVerse();
  if(e.key==="ArrowLeft") prevVerse();
});
</script>

</body>
</html>
