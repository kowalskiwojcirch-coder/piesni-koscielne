<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Tugal kościelny</title>

<link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  background:#111;
  height:100vh;
  display:flex;
}

/* ===== TV ===== */
#tv{
  flex:1;
  margin:30px;
  background:#000;
  border:20px solid #1a1a1a;
  padding:60px;
  position:relative;
  display:none;
  align-items:center;
  justify-content:center;
  font-family:'VT323', monospace;
}

#tvText{
  color:#ff9900;
  font-size:52px;
  line-height:1.9;
  text-align:center;
  white-space:pre-line;
  width:100%;
}

/* kropki w rogach */
.dot{
  position:absolute;
  color:#ff9900;
  font-size:40px;
}
.tl{top:15px;left:15px}
.tr{top:15px;right:15px}
.bl{bottom:15px;left:15px}
.br{bottom:15px;right:15px}

/* ===== PANEL ===== */
#side{
  width:380px;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

/* ===== EDYCJA ===== */
textarea{
  height:120px;
  resize:none;
  padding:10px;
  font-size:16px;
}

/* ===== TUGAL ===== */
#tugal{
  background:#2a2a2a;
  padding:15px;
  border:2px solid #111;
  font-family:'Press Start 2P', monospace;
}

/* LCD */
#lcd{
  background:#1c2a1c;
  color:#9fd89f;
  height:80px;
  padding:8px;
  font-size:10px;
  box-shadow:inset 0 0 10px #000;
  white-space:pre-line;
}

/* dioda */
#led{
  width:12px;
  height:12px;
  border-radius:50%;
  background:#400;
  margin:8px 0;
}
#led.on{
  background:#f00;
  box-shadow:0 0 8px #f00;
}

/* klawiatura */
#keys{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.key{
  background:#333;
  color:#9fd89f;
  border:1px solid #111;
  padding:10px 0;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- TV -->
<div id="tv">
  <div class="dot tl">•</div>
  <div class="dot tr">•</div>
  <div class="dot bl">•</div>
  <div class="dot br">•</div>
  <div id="tvText"></div>
</div>

<!-- PANEL -->
<div id="side">

  <textarea id="input" placeholder="Wpisz własny tekst (zwrotki Enterem)"></textarea>

  <div id="tugal">
    <div id="lcd">TUGAL OFF</div>
    <div id="led"></div>

    <div id="keys">
      <button class="key" onclick="prev()">▲</button>
      <button class="key" onclick="next()">▼</button>
      <button class="key" onclick="toggle()">ON/OFF</button>

      <button class="key" onclick="loadSong(0)">1</button>
      <button class="key" onclick="loadSong(1)">2</button>
      <button class="key" onclick="loadSong(2)">3</button>

      <button class="key" onclick="loadCustom()">TXT</button>
      <button class="key" onclick="clearTV()">CLR</button>
      <button class="key"></button>
    </div>
  </div>

</div>

<script>
const songs=[
 {title:"Barka",verses:["Pan kiedyś stanął nad brzegiem","By łowić serca słów Bożych prawdą"]},
 {title:"Abba Ojcze",verses:["Ty wyzwoliłeś nas Panie","Chrystus stał się Barankiem"]},
 {title:"Czarna Madonna",verses:["Jest zakątek na tej ziemi","Na Jasnej Górze"]}
];

let tvOn=false,lines=[],i=0;

function toggle(){
 tvOn=!tvOn;
 document.getElementById("tv").style.display=tvOn?"flex":"none";
 document.getElementById("led").className=tvOn?"on":"";
 document.getElementById("lcd").textContent=tvOn?"TUGAL ON":"TUGAL OFF";
}

function loadSong(n){
 if(!tvOn) return;
 lines=songs[n].verses;i=0;update();
 document.getElementById("lcd").textContent=songs[n].title;
}

function loadCustom(){
 if(!tvOn) return;
 lines=document.getElementById("input").value.split("\n");
 i=0;update();
 document.getElementById("lcd").textContent="TEKST WL";
}

function update(){
 document.getElementById("tvText").textContent=lines[i]||"";
}

function next(){if(i<lines.length-1){i++;update();}}
function prev(){if(i>0){i--;update();}}

function clearTV(){
 document.getElementById("tvText").textContent="";
}
</script>

</body>
</html>
