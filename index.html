<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Kościelna projekcja</title>

<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  background:#111;
  height:100vh;
  display:flex;
  font-family:'Libre Baskerville', serif;
}

/* ===== LEWA STRONA: TV ===== */
#tv{
  flex:1;
  margin:30px;
  background:black;
  border:18px solid #222;
  box-shadow:0 0 60px #000;
  padding:60px;
  box-sizing:border-box;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

#tvText{
  color:#ff9900;
  font-size:44px;
  line-height:1.9;
  text-align:center;
  white-space:pre-line;
  width:100%;
}

/* kropki w rogach */
.dot{
  position:absolute;
  width:10px;
  height:10px;
  background:#ff9900;
}
.tl{top:15px;left:15px}
.tr{top:15px;right:15px}
.bl{bottom:15px;left:15px}
.br{bottom:15px;right:15px}

/* ===== PRAWA STRONA ===== */
#side{
  width:420px;
  padding:20px;
  box-sizing:border-box;
  display:flex;
  flex-direction:column;
  gap:20px;
}

/* EDYTOR */
#editor{
  flex:1;
}

#editor textarea{
  width:100%;
  height:100%;
  resize:none;
  font-size:18px;
  padding:15px;
  box-sizing:border-box;
}

/* PRZYCISKI */
.controls button{
  width:100%;
  padding:12px;
  font-size:16px;
  margin-bottom:10px;
  cursor:pointer;
}

/* ===== TUGAL ===== */
#tugal{
  background:#2b2b2b;
  padding:15px;
  border:2px solid #111;
  font-family:'Press Start 2P', monospace;
}

#lcd{
  background:#0f0;
  color:#030;
  height:80px;
  padding:8px;
  font-size:11px;
  line-height:1.4;
  margin-bottom:10px;
  white-space:pre-line;
}

#keys{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.key{
  background:#333;
  color:#0f0;
  border:none;
  padding:10px 0;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- TV -->
<div id="tv">
  <div class="dot tl"></div>
  <div class="dot tr"></div>
  <div class="dot bl"></div>
  <div class="dot br"></div>

  <div id="tvText">⋯ ⋯ ⋯ ⋯</div>
</div>

<!-- BOK -->
<div id="side">

  <!-- EDYTOR -->
  <div id="editor">
    <textarea id="textInput" placeholder="Wpisz lub wklej tekst pieśni..."></textarea>
  </div>

  <div class="controls">
    <button onclick="showText()">WYŚWIETL TEKST</button>
    <button onclick="clearText()">WYCZYŚĆ / ZAKOŃCZ</button>
    <button onclick="toggleTugal()">WŁ / WYŁ TUGAL</button>
    <button onclick="toggleTV()">WŁ / WYŁ PROJEKCJĘ</button>
  </div>

  <!-- TUGAL -->
  <div id="tugal">
    <div id="lcd">SYSTEM OK</div>
    <div id="keys">
      <button class="key">1</button><button class="key">2</button><button class="key">3</button>
      <button class="key">4</button><button class="key">5</button><button class="key">6</button>
      <button class="key">7</button><button class="key">8</button><button class="key">9</button>
    </div>
  </div>

</div>

<script>
const tvText=document.getElementById("tvText");
const input=document.getElementById("textInput");
const tugal=document.getElementById("tugal");
const tv=document.getElementById("tv");

function showText(){
  tvText.textContent="⋯ ⋯ ⋯ ⋯\n\n"+input.value+"\n\n⋯ ⋯ ⋯ ⋯";
}

function clearText(){
  tvText.textContent="⋯ ⋯ ⋯ ⋯";
}

function toggleTugal(){
  tugal.style.display = tugal.style.display==="none"?"block":"none";
}

function toggleTV(){
  tv.style.display = tv.style.display==="none"?"flex":"none";
}
</script>

</body>
</html>
