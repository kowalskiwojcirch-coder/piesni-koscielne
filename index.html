<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Tugal kościelny – projekcja</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto+Slab:wght@500;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  background:#111;
  height:100vh;
  font-family:'Roboto Slab', serif;
}

/* UKŁAD */
#stage{
  position:relative;
  width:100%;
  height:100%;
}

/* ===== TELEWIZOR ===== */
#tv{
  position:absolute;
  top:40px;
  left:40px;
  right:40px;
  bottom:160px;
  background:#000;
  border:18px solid #222;
  box-shadow:0 0 50px #000;
  padding:60px;
  box-sizing:border-box;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

#tvTitle{
  color:#ff9900;
  font-size:56px;
  text-align:center;
  margin-bottom:50px;
}

#tvVerse{
  color:#ff9900;
  font-size:42px;
  text-align:center;
  line-height:1.8;
  white-space:pre-line;
}

/* ===== TUGAL ===== */
#tugal{
  position:absolute;
  right:60px;
  bottom:30px;
  width:320px;
  background:#2b2b2b;
  border:3px solid #111;
  border-radius:6px;
  padding:16px;
  box-shadow:inset 0 0 12px #000;
  font-family:'Press Start 2P', monospace;
}

/* LCD */
#lcd{
  background:#0f0;
  color:#030;
  height:90px;
  padding:8px;
  font-size:11px;
  line-height:1.4;
  box-shadow:inset 0 0 10px #030;
  white-space:pre-line;
  margin-bottom:10px;
}

/* LED */
#led{
  width:10px;
  height:10px;
  background:#0f0;
  border-radius:50%;
  box-shadow:0 0 6px #0f0;
  margin-bottom:10px;
}

/* KLAWIATURA */
#keys{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.key{
  background:#3a3a3a;
  color:#0f0;
  border:1px solid #111;
  padding:10px 0;
  font-size:13px;
  cursor:pointer;
}

.key:active{
  background:#0f0;
  color:#030;
}
</style>
</head>

<body>

<div id="stage">

  <!-- TELEWIZOR -->
  <div id="tv">
    <div id="tvTitle">Wybierz pieśń</div>
    <div id="tvVerse">---</div>
  </div>

  <!-- TUGAL -->
  <div id="tugal">
    <div id="lcd">SYSTEM OK\nWYBIERZ PIESN</div>
    <div id="led"></div>

    <div id="keys">
      <button class="key" onclick="prevVerse()">▲</button>
      <button class="key" onclick="nextVerse()">▼</button>
      <button class="key" onclick="resetVerse()">R</button>

      <button class="key" onclick="loadSong(0)">1</button>
      <button class="key" onclick="loadSong(1)">2</button>
      <button class="key" onclick="loadSong(2)">3</button>

      <button class="key" onclick="loadSong(3)">4</button>
      <button class="key" onclick="loadSong(4)">5</button>
      <button class="key">*</button>

      <button class="key">#</button>
      <button class="key" onclick="loadSong(5)">0</button>
      <button class="key">OK</button>
    </div>
  </div>

</div>

<script>
const songs=[
 {title:"Barka",verses:[
  "Pan kiedyś stanął nad brzegiem\nSzukał ludzi gotowych pójść za Nim",
  "By łowić serca\nSłów Bożych prawdą",
  "Z Nim płynęli przez życie\nNie lękając się niczego"
 ]},
 {title:"Abba Ojcze",verses:[
  "Ty wyzwoliłeś nas Panie\nZ kajdan i samych siebie",
  "Chrystus stał się Barankiem\nOfiarą miłości"
 ]},
 {title:"Czarna Madonna",verses:[
  "Jest zakątek na tej ziemi\nGdzie powracać każdy chce",
  "Gdzie króluje Jej Oblicze\nNa Jasnej Górze"
 ]},
 {title:"Kiedy ranne wstają zorze",verses:[
  "Kiedy ranne wstają zorze\nTobie ziemia, Tobie morze",
  "Tobie śpiewa żywioł wszelki\nChwałę Tobie"
 ]},
 {title:"Z dawna Polski",verses:[
  "Z dawna Polski Tyś Królową, Maryjo",
  "Ty za nami przemów słowo, Maryjo"
 ]},
 {title:"Pan blisko jest",verses:[
  "Pan blisko jest\nOczekuj Go",
  "Pan blisko jest\nW Nim serca moc"
 ]}
];

let cs=null,cv=0;

function loadSong(i){cs=i;cv=0;update();}
function nextVerse(){if(cs!==null&&cv<songs[cs].verses.length-1){cv++;update();}}
function prevVerse(){if(cs!==null&&cv>0){cv--;update();}}
function resetVerse(){if(cs!==null){cv=0;update();}}

function update(){
 document.getElementById("tvTitle").textContent=songs[cs].title;
 document.getElementById("tvVerse").textContent=songs[cs].verses[cv];
 document.getElementById("lcd").textContent=
  songs[cs].title+"\nZWROTKA "+(cv+1);
}

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowUp")prevVerse();
 if(e.key==="ArrowDown")nextVerse();
});
</script>

</body>
</html>
