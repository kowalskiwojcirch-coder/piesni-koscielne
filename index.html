<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Pieśni kościelne</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: 'Cinzel', serif;
}

/* MENU */
#menu {
  position: fixed;
  left: 0;
  top: 0;
  width: 300px;
  height: 100%;
  background: #111;
  padding: 20px;
  overflow-y: auto; /* PRZEWIJANIE LISTY */
}

button {
  width: 100%;
  margin: 6px 0;
  padding: 10px;
  font-size: 16px;
  cursor: pointer;
}

/* EKRAN */
#screen {
  margin-left: 320px;
  padding: 40px;
  font-size: 42px;
  white-space: pre-line;
  height: 100vh;
  overflow-y: auto; /* PRZEWIJANIE TEKSTU */
}
</style>
</head>

<body>

<div id="menu">
  <h2>Pieśni kościelne</h2>

  <!-- LISTA PIEŚNI -->
  <button onclick="pokaz(0)">Barka</button>
  <button onclick="pokaz(1)">Czarna Madonna</button>
  <button onclick="pokaz(2)">Abba Ojcze</button>
  <button onclick="pokaz(3)">Kiedy ranne wstają zorze</button>
  <button onclick="pokaz(4)">Z dawna Polski Tyś Królową</button>

  <!-- możesz dodać 200+ takich -->
</div>

<div id="screen">
  Wybierz pieśń z listy
</div>

<script>
const piesni = [
`BARKA

Pan kiedyś stanął nad brzegiem
Szukał ludzi gotowych pójść za Nim
By łowić serca słów Bożych prawdą`,

`CZARNA MADONNA

Jest zakątek na tej ziemi
Gdzie powracać każdy chce
Gdzie króluje Jej Oblicze`,

`ABBA OJCZE

Ty wyzwoliłeś nas Panie
Z kajdan i samych siebie
A Chrystus stał się Barankiem`,

`KIEDY RANNE WSTAJĄ ZORZE

Kiedy ranne wstają zorze
Tobie ziemia, Tobie morze
Tobie śpiewa żywioł wszelki`,

`Z DAWNA POLSKI TYŚ KRÓLOWĄ

Z dawna Polski Tyś Królową, Maryjo
Ty za nami przemów słowo, Maryjo`
];

function pokaz(nr) {
  document.getElementById("screen").textContent = piesni[nr];
}
</script>

</body>
</html>
