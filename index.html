<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Pieśni kościelne</title>

<!-- Pixelowa czcionka -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background: #000;
  color: #0f0; /* klasyczny zielony pixel look */
  font-family: 'Press Start 2P', cursive;
  overflow: hidden;
}

/* MENU */
#menu {
  position: fixed;
  left: 0;
  top: 0;
  width: 320px;
  height: 100%;
  background: rgba(0,0,0,0.95);
  padding: 20px;
  overflow-y: auto;
  box-shadow: 4px 0 20px rgba(0,0,0,0.6);
}

#menu h2 {
  text-align: center;
  margin-bottom: 15px;
}

#search {
  width: 100%;
  padding: 8px;
  margin-bottom: 10px;
  font-size: 12px;
}

.song {
  width: 100%;
  margin: 4px 0;
  padding: 6px;
  font-size: 10px;
  background: #111;
  border: none;
  color: #0f0;
  cursor: pointer;
}
.song:hover {
  background: #222;
}

/* EKRAN */
#screen {
  margin-left: 340px;
  padding: 40px;
  height: 100vh;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  text-shadow: 1px 1px 4px #000;
}

#title {
  font-size: 36px;
  text-align: center;
  margin-bottom: 20px;
}

#verse {
  font-size: 18px;
  line-height: 1.5;
  text-align: center;
  white-space: pre-line;
  flex-grow: 1;
}

/* KONTROLA */
#controls {
  text-align: center;
  margin-top: 20px;
}

.ctrl {
  font-size: 12px;
  padding: 6px 12px;
  margin: 0 10px;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="menu">
  <h2>Pieśni kościelne</h2>
  <input type="text" id="search" placeholder="Szukaj pieśni..." onkeyup="searchSongs()">

  <div id="songList">
    <!-- Pieśni wygenerowane dynamicznie -->
  </div>
</div>

<div id="screen">
  <div id="title">Wybierz pieśń</div>
  <div id="verse">Zwrotka pojawi się tutaj</div>

  <div id="controls">
    <button class="ctrl" onclick="prevVerse()">⬅ Poprzednia</button>
    <button class="ctrl" onclick="nextVerse()">Następna ➡</button>
  </div>
</div>

<script>
// 50 przykładowych pieśni
const songs = [];
for(let i=1;i<=50;i++){
  songs.push({
    title:`Pieśń ${i}`,
    verses:[
      `Zwrotka 1 pieśni ${i}\nTekst przykładowy`,
      `Zwrotka 2 pieśni ${i}\nTekst przykładowy`,
      `Zwrotka 3 pieśni ${i}\nTekst przykładowy`
    ]
  });
}

let currentSong = null;
let currentVerse = 0;

// Generowanie listy pieśni
function generateSongList(){
  const list = document.getElementById("songList");
  list.innerHTML="";
  songs.forEach((song,i)=>{
    const btn = document.createElement("button");
    btn.className="song";
    btn.textContent=song.title;
    btn.onclick = ()=>loadSong(i);
    list.appendChild(btn);
  });
}

generateSongList();

// Wyszukiwarka
function searchSongs(){
  const term = document.getElementById("search").value.toLowerCase();
  const list = document.getElementById("songList");
  list.innerHTML="";
  songs.forEach((song,i)=>{
    if(song.title.toLowerCase().includes(term)){
      const btn = document.createElement("button");
      btn.className="song";
      btn.textContent=song.title;
      btn.onclick = ()=>loadSong(i);
      list.appendChild(btn);
    }
  });
}

// Ładowanie pieśni
function loadSong(index){
  currentSong = index;
  currentVerse = 0;
  document.getElementById("title").textContent = songs[index].title;
  document.getElementById("verse").textContent = songs[index].verses[0];
}

// Przewijanie zwrotek
function nextVerse(){
  if(currentSong===null) return;
  if(currentVerse<songs[currentSong].verses.length-1){
    currentVerse++;
    document.getElementById("verse").textContent = songs[currentSong].verses[currentVerse];
  }
}

function prevVerse(){
  if(currentSong===null) return;
  if(currentVerse>0){
    currentVerse--;
    document.getElementById("verse").textContent = songs[currentSong].verses[currentVerse];
  }
}

// Sterowanie strzałkami
document.addEventListener('keydown',function(e){
  if(e.key==="ArrowRight") nextVerse();
  if(e.key==="ArrowLeft") prevVerse();
});
</script>

</body>
</html>
